# Builds Crest, signs it with the updater key, and publishes a GitHub Release
# containing the installer, its `.sig`, and the `latest.json` manifest that
# installed copies poll.
#
# THE VERSION IN tauri.conf.json IS THE TRIGGER.
#
# This used to be tag-only: you tagged by hand and the tag started the build.
# Now a push to `main` whose `product/src-tauri/tauri.conf.json` carries a
# version that has never been released makes the tag for you and then builds it.
# Merging a version bump *is* the release.
#
# The guard against accidents is not a path filter, it is the tag itself: the
# gate below asks the remote whether `v<version>` already exists and stops if it
# does. So editing tauri.conf.json for any other reason (a window setting, a
# bundle option) does nothing, re-running does nothing, and only a number that
# has never shipped can ship. Every push to main runs the gate — it is a
# checkout and one `git ls-remote`, a few seconds — and almost all of them stop
# there.
#
# The hand-tagged path still works exactly as it did, and is the way to re-cut a
# release whose build failed. See Release.md.
#
# Note for anyone extending this: a tag pushed with the default GITHUB_TOKEN
# does NOT trigger workflows — GitHub blocks that to stop workflows recursing.
# This file does not care, because the gate and the build are two jobs in one
# run rather than two workflows chained through a tag. Do not split them apart
# expecting the tag push to start the second half; it will not, and the failure
# is silent.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  contents of ~/.tauri/crest.key
#
# There is deliberately no TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret. The key was
# generated without one, and GitHub refuses to store an empty secret value — so
# the reference below resolves to "", which is the correct password for this key.
# Do not "fix" the missing secret by inventing a value.

name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  # Lets you re-run a failed publish from the Actions tab without moving a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.2.0)'
        required: true

# One release at a time, and never cancel one in flight — a half-finished
# publish is a release page with some of its assets.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # Decide whether this push is a release, and if so make the tag for it.
  #
  # Everything that can say no lives here, before anything is published and
  # before the tag exists: a version that already shipped, a changelog section
  # that is missing or empty, a lib/site.ts left on the old number. A failure in
  # this job leaves the repo exactly as it found it — no stray tag to clean up.
  # ------------------------------------------------------------------ #
  gate:
    name: Decide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Three ways in, and they disagree about who names the version:
      #   dispatch / tag push — the tag is authoritative, the human chose it
      #   push to main        — tauri.conf.json is authoritative
      - name: Resolve target
        id: target
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$DISPATCH_TAG"
            source="dispatch"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            source="tag"
          else
            tag="v$(node -p "require('./product/src-tauri/tauri.conf.json').version")"
            source="branch"
          fi
          echo "Resolved $source → $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"

      # A hand-pushed tag or a dispatch is an explicit instruction and always
      # proceeds. A push to main only proceeds if this version has never been
      # released — that check is the whole safety mechanism.
      - name: Has this version already shipped?
        id: decide
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SOURCE: ${{ steps.target.outputs.source }}
        run: |
          set -euo pipefail
          if [ "$SOURCE" != "branch" ]; then
            echo "$SOURCE: releasing $TAG as instructed."
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists — this push did not bump the version. Nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$TAG has never been released. Proceeding."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Shared with ci.yml, so a pull request cannot pass a consistency check
      # that the release then fails. Also produces the release body.
      - name: Validate release metadata
        id: meta
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: node .github/scripts/release-meta.mjs --expect "$TAG"

      - name: Create and push tag
        if: steps.decide.outputs.release == 'true' && steps.target.outputs.source == 'branch'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Crest $VERSION"
          git push origin "refs/tags/$TAG"
          echo "Tagged ${{ github.sha }} as $TAG"

  # ------------------------------------------------------------------ #
  # Build and publish.
  # ------------------------------------------------------------------ #
  release:
    name: Build and publish
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    # tauri-action creates the release and uploads assets, both of which are
    # writes to the repository.
    permissions:
      contents: write

    steps:
      # Always the tag, never the branch — by this point it exists either way,
      # so the build is reproducible from the same ref that gets published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: product/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of this app is ~10 minutes; cached it is ~2.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: product/src-tauri

      - name: Install frontend dependencies
        working-directory: product
        run: npm ci

      # Release notes come from CHANGELOG.md rather than a string in this file,
      # so each release gets its own text without editing the workflow. They are
      # extracted in the gate job above, before the tag is made, so a missing
      # section fails while it is still free to fix.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: product
          tagName: ${{ needs.gate.outputs.tag }}
          releaseName: 'Crest __VERSION__'
          releaseBody: ${{ needs.gate.outputs.notes }}
          # Published immediately — a draft release is not reachable at the
          # `releases/latest/download/latest.json` URL the app polls, so leaving
          # it drafted would silently ship nothing.
          releaseDraft: false
          prerelease: false
          # `bundle.targets` is "all", so Windows produces both a .msi and an NSIS
          # -setup.exe and the action has to pick one for latest.json. It defaults
          # to the .msi, which is the wrong half: NSIS is the bundle this app
          # customizes, and .msi updates prompt for admin on every install.
          updaterJsonPreferNsis: true
          # Windows only for now; add `macos-latest` / `ubuntu-22.04` to a matrix
          # here when there is something to ship on them.
          args: --target x86_64-pc-windows-msvc
