  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var hz = document.querySelector('#f03-hotzone');
      var hztag = document.querySelector('#f03-hztag');
      var dwelltag = document.querySelector('#f03-dwelltag');
      var pill = document.querySelector('#f03-pill');
      var card = document.querySelector('#f03-card');
      var ring = document.querySelector('#f03-ring');
      var ringFg = document.querySelector('#f03-ring-fg');
      var cursor = document.querySelector('#f03-cursor');

      var cardKids = [
        document.querySelector('#root .f03-nav'),
        document.querySelector('#root .f03-art'),
        document.querySelector('#root .f03-title'),
        document.querySelector('#root .f03-artist'),
        document.querySelector('#root .f03-scrub'),
        document.querySelector('#root .f03-tr')
      ];

      /* svg-path-draw on the dwell ring: circumference of r=44 */
      var RING_LEN = 2 * Math.PI * 44;
      ringFg.style.strokeDasharray = RING_LEN;

      /* ============ Scene 1 (0.0-2.0s) — the measured trigger + the approach ==== */
      tl.fromTo(hz, { autoAlpha: 0, scaleX: 0.2 },
        { autoAlpha: 1, scaleX: 1, duration: 0.5, ease: 'power3.out' }, 0.25);
      tl.fromTo(hztag, { autoAlpha: 0, x: 16 },
        { autoAlpha: 1, x: 0, duration: 0.45, ease: 'power3.out' }, 0.62);

      /* cursor-click-ripple, travel leg only — the cursor rises from off-frame and
         decelerates into the strip. Lands as the VO says "screen" (1.26). */
      tl.fromTo(cursor, { autoAlpha: 0, y: 900 },
        { autoAlpha: 1, y: 0, duration: 1.15, ease: 'power3.out' }, 0.35);

      /* ============ Scene 2 (2.0-4.2s) — the pill peeks, the dwell fills ======= */
      /* spring-pop-entrance in its smooth long-tail register: no overshoot. */
      tl.fromTo(pill, { autoAlpha: 0, scaleY: 0.35, scaleX: 0.92 },
        { autoAlpha: 1, scaleY: 1, scaleX: 1, duration: 0.55, ease: 'power3.out' }, 2.16);

      tl.fromTo(dwelltag, { autoAlpha: 0, x: -14 },
        { autoAlpha: 1, x: 0, duration: 0.4, ease: 'power3.out' }, 3.05);
      tl.fromTo(ring, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: 'none' }, 3.05);

      /* The ring's fill IS the 600ms — cued exactly to the spoken number
         ("six hundred milliseconds", word timings 3.14 -> 3.70). */
      tl.fromTo(ringFg, { strokeDashoffset: RING_LEN },
        { strokeDashoffset: 0, duration: 0.62, ease: 'none' }, 3.14);

      /* ============ Scene 3 (4.2-5.773s) — it opens ============================ */
      tl.fromTo(ring, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, 4.42);
      tl.fromTo(dwelltag, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.3, ease: 'power2.in' }, 4.42);

      /* card-morph-anchor — the pill hands off to the card at the same top edge,
         so the card grows downward out of it. Lands on "It opens" (4.90). */
      tl.fromTo(pill, { autoAlpha: 1 }, { autoAlpha: 0, duration: 0.22, ease: 'power2.in' }, 4.86);
      tl.fromTo(card, { autoAlpha: 0, scaleY: 0.21, scaleX: 0.98 },
        { autoAlpha: 1, scaleY: 1, scaleX: 1, duration: 0.62, ease: 'power3.out' }, 4.88);
      tl.fromTo(cardKids, { autoAlpha: 0, y: 12 },
        { autoAlpha: 1, y: 0, duration: 0.4, ease: 'power3.out', stagger: 0.05 }, 5.12);
      /* Held. The cursor rests where it is; no back-half camera move. */

      window.__timelines['03-nudge'] = tl;
    })();
  </script>
