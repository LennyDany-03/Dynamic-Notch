  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var panels = [];
      for (var i = 0; i < 7; i++) panels.push(document.querySelector('#f04-p' + i));
      var label = document.querySelector('#f04-navlabel');
      var chevL = document.querySelector('#f04-chevL');
      var chevR = document.querySelector('#f04-chevR');
      var play = document.querySelector('#f04-play');
      var seven = document.querySelector('#f04-seven');
      var bars = [0, 1, 2, 3].map(function (n) { return document.querySelector('#f04-b' + n); });

      var NAMES = ['Media controls', 'Launcher', 'System', 'Weather', 'Timer', 'Notes', 'Calendar'];
      /* Cue table straight off the TTS word timings. */
      var CUES = [0.0, 1.44, 3.60, 4.92, 5.76, 6.70, 7.34];

      /* Panel 0 is present from t=0; the rest start hidden. */
      gsap.set(panels, { autoAlpha: 0 });
      gsap.set(panels[0], { autoAlpha: 1 });
      gsap.set(bars, { scaleX: 0 });

      /* discrete-text-sequence — instant hard-cut replacement at each threshold.
         The shell and the nav strip never move; only the region beneath swaps. */
      for (var s = 1; s < 7; s++) {
        (function (idx) {
          var at = CUES[idx];
          tl.set(panels, { autoAlpha: 0 }, at);
          tl.set(panels[idx], { autoAlpha: 1 }, at);
          tl.set(label, { textContent: NAMES[idx] }, at);
          /* a short incoming settle gives the cut velocity rather than a dissolve */
          tl.fromTo(panels[idx], { x: 16 }, { x: 0, duration: 0.16, ease: 'power2.out' }, at);
        })(s);
      }

      /* ============ Scene 1 (0.0-1.2s) — "Music": the transport lights ========= */
      tl.fromTo(play, { scale: 1 }, { scale: 1.14, duration: 0.18, ease: 'power2.out' }, 0.22);
      tl.to(play, { scale: 1, duration: 0.34, ease: 'power3.out' }, 0.40);

      /* ============ Scene 2 (1.2-4.4s) — two steady steps ===================== */
      /* stat-bars-and-fills: the four meters fill on the CPU cue (3.60). */
      tl.fromTo(bars, { scaleX: 0 },
        { scaleX: function (i) { return [0.97, 0.64, 0.38, 0.12][i]; },
          duration: 0.7, ease: 'power3.out', stagger: 0.06 }, 3.66);

      /* ============ Scene 3 (4.4-7.2s) — the cadence tightens ================= */
      /* (handled by the CUES table above: weather 4.92, timer 5.76, notes 6.70) */

      /* ============ Scene 4 (7.2-10.292s) — the payoff, then a long hold ====== */
      tl.fromTo(seven, { autoAlpha: 0, scale: 0.7 },
        { autoAlpha: 1, scale: 1, duration: 0.6, ease: 'power3.out' }, 7.84);
      tl.fromTo([chevL, chevR], { scale: 1, color: 'rgba(255,255,255,0.5)' },
        { scale: 1.25, color: '#2F6FED', duration: 0.22, ease: 'power2.out' }, 9.10);
      tl.to([chevL, chevR], { scale: 1, color: 'rgba(255,255,255,0.5)', duration: 0.5, ease: 'power3.out' }, 9.34);
      /* Then still to the end — the longest hold in the video, after six cuts. */

      window.__timelines['04-panels'] = tl;
    })();
  </script>
