  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var world = document.querySelector('#f05-world');
      var card = document.querySelector('#f05-card');
      var pill = document.querySelector('#f05-pill');
      var hz = document.querySelector('#f05-hz');
      var cursor = document.querySelector('#f05-cursor');
      var t1 = document.querySelector('#f05-t1');
      var t2 = document.querySelector('#f05-t2');
      var t3 = document.querySelector('#f05-t3');

      /* Opening state — matched to frame 04's close: card open, camera pushed in. */
      gsap.set(world, { scale: 2.82 });
      gsap.set(pill, { autoAlpha: 0 });
      gsap.set(hz, { autoAlpha: 0 });
      gsap.set([t1, t2, t3], { autoAlpha: 0 });

      /* ====== Scene 1 (0.0-1.85s) — the cursor leaves, the notch steps down ==== */
      tl.fromTo(cursor, { autoAlpha: 1, y: 0 },
        { autoAlpha: 0, y: 820, duration: 0.62, ease: 'power2.in' }, 0.24);

      /* Three DISCRETE states, not a fade — the product's real step-down, after
         its real 300ms grace. expanded -> pill -> gone. */
      tl.set(card, { autoAlpha: 0 }, 1.16);
      tl.set(pill, { autoAlpha: 1 }, 1.16);
      tl.set(pill, { autoAlpha: 0 }, 1.78);

      /* ====== Scene 2 (1.85-2.55s) — ONE decelerating burst, then LOCK ========= */
      tl.fromTo(world, { scale: 2.82 },
        { scale: 1, duration: 0.70, ease: 'power4.out' }, 1.85);
      /* The zoom ends at 2.55s of 6.66s. Everything after it is the post-lock act. */

      /* ====== Scene 3 (2.55-6.661s) — post-lock. Dead still. ================== */
      tl.fromTo(hz, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: 'power2.out' }, 2.60);

      /* Each tag lands on its spoken cue: 2.64 / 4.32 / 5.98. */
      tl.fromTo(t1, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 2.70);
      tl.fromTo(t2, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: 'power3.out' }, 4.38);
      tl.fromTo(t3, { autoAlpha: 0, y: 16 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: 'power3.out' }, 6.02);
      /* No drift, no push, no jitter. This frame's silence is doing the work. */

      window.__timelines['05-gone'] = tl;
    })();
