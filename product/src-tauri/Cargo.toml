[package]
name = "windows_dynamic_noich"
version = "0.1.0"
description = "Crest — Windows Dynamic Notch"
authors = ["LennyDany-03"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "windows_dynamic_noich_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
arboard = "3"
png = "0.17"

[target.'cfg(windows)'.dependencies]
# Reading and restoring the shell's "show notification banners" switch, which
# lives only in HKCU and has no WinRT surface. See `notifications.rs`.
winreg = "0.52"
windows = { version = "0.58", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  # The machine's own state, for the notch's system banners. See `system.rs`.
  "Networking_Connectivity",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Win32_System_Power",
  # Foreground-window lookup, for clipboard capture exclusion.
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  # Launcher icons arrive as HBITMAP DIB sections.
  "Win32_Graphics_Gdi",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
