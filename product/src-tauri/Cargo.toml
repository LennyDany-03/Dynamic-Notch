[package]
name = "windows_dynamic_noich"
version = "0.7.1"
description = "Crest — Windows Dynamic Notch"
authors = ["LennyDany-03"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "windows_dynamic_noich_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
# The summon shortcut. A global hotkey has to be registered with the OS — a
# keydown listener in the webview only fires for a window that has focus, and the
# notch deliberately never takes any. See `hotkey.rs`.
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
arboard = "3"
png = "0.17"
# Weather, and nothing else — see `weather.rs` for why the fetch is here rather
# than in the webview. `rustls` (0.13's name for what used to be `rustls-tls`)
# rather than the default native-tls stack, because `tauri-plugin-updater`
# already pulls rustls in: this adds a feature to a crate that is compiled either
# way instead of a second TLS implementation.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
  "charset",
  "http2",
  "system-proxy",
] }

[target.'cfg(windows)'.dependencies]
# Reading and restoring the shell's "show notification banners" switch, which
# lives only in HKCU and has no WinRT surface. See `notifications.rs`.
winreg = "0.52"
windows = { version = "0.58", features = [
  "Media_Control",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  # The machine's own state, for the notch's system banners. See `system.rs`.
  "Networking_Connectivity",
  "Devices_Bluetooth",
  "Devices_Enumeration",
  "Win32_Devices_FunctionDiscovery",
  # Windows Core Audio endpoints behind Quick Access.
  "Win32_Media_Audio",
  "Win32_System_Power",
  # CPU / GPU / disk / thermal counters and the power row, for `perf.rs`.
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_System_Shutdown",
  # Foreground-window lookup, for clipboard capture exclusion.
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  # Launcher icons arrive as HBITMAP DIB sections.
  "Win32_Graphics_Gdi",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
